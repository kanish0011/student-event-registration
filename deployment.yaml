apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-event-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-event
  template:
    metadata:
      labels:
        app: student-event
    spec:
      containers:
        - name: student-event-container
          image: kanish0011/student-event-registration:v1
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: student-event-service
spec:
  type: NodePort
  selector:
    app: student-event
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
